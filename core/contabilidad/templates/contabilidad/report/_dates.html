            <label>Desde:</label>

    </div>

        <div class="form-group">
            <label>Hasta:</label>
            <input type="date" class="form-control" id="endDate" value="{{ today }}">

    <div class="col-lg-2 col-md-6">
        <div class="form-group">
            <label>&nbsp;</label><br>
            <button type="button" class="btn btn-primary btn-flat" id="btnSearch"><i class="fas fa-search"></i> Consultar</button>
        </div>
    </div>
</div>
