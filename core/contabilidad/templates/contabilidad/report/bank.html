{% extends 'report.html' %}
{% load static %}
{% block assets_report %}
    <script>
        window.REPORT = {
            columns: [
                {data: 'date'}, {data: 'number'}, {data: 'description'},
                {data: 'debit', money: true}, {data: 'credit', money: true}, {data: 'balance', money: true}
            ],
            totals: [3, 4],
            extra: function () {
                return {'bank_account': $('#bankSelect').val()};
            }
        };
    </script>
    <script src="{% static 'contabilidad/js/report.js' %}"></script>
{% endblock %}

{% block content_report %}
    <div class="row">
        <div class="col-lg-4 col-md-12">
            <div class="form-group">
                <label>Cuenta bancaria:</label>
                <select class="form-control" id="bankSelect">
                    {% for bank in banks %}
                        <option value="{{ bank.id }}">{{ bank }}</option>
                    {% empty %}
                        <option value="">No hay cuentas bancarias registradas</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="col-lg-2 col-md-6">
            <div class="form-group">
                <label>Desde:</label>
                <input type="date" class="form-control" id="startDate" value="{{ month_start }}">
            </div>
        </div>
        <div class="col-lg-2 col-md-6">
            <div class="form-group">
                <label>Hasta:</label>
                <input type="date" class="form-control" id="endDate" value="{{ today }}">
            </div>
        </div>
        <div class="col-lg-2 col-md-6">
            <div class="form-group">
                <label>&nbsp;</label><br>
                <button type="button" class="btn btn-primary btn-flat" id="btnSearch"><i class="fas fa-search"></i> Consultar</button>
            </div>
        </div>
    </div>
    <table class="table table-bordered table-sm" id="tblReport" style="width:100%;">
        <thead>
        <tr>
            <th>Fecha</th>
            <th>Asiento</th>
            <th>Descripción</th>
            <th class="text-right">Entradas (Debe)</th>
            <th class="text-right">Salidas (Haber)</th>
            <th class="text-right">Saldo</th>
        </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-right">Totales del período</th>
            <th class="text-right"></th>
            <th class="text-right"></th>
            <th></th>
        </tr>
        </tfoot>
    </table>
{% endblock %}
