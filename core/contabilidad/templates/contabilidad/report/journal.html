{% extends 'report.html' %}
{% load static %}
{% block assets_report %}
    <script>
        window.REPORT = {
            columns: [
                {data: 'date'}, {data: 'number'}, {data: 'account'}, {data: 'description'},
                {data: 'debit', money: true}, {data: 'credit', money: true}
            ],
            totals: [4, 5]
        };
    </script>
    <script src="{% static 'contabilidad/js/report.js' %}"></script>
{% endblock %}

{% block content_report %}
    {% include 'contabilidad/report/_dates.html' %}
    <table class="table table-bordered table-sm" id="tblReport" style="width:100%;">
        <thead>
        <tr>
            <th>Fecha</th>
            <th>Asiento</th>
            <th>Cuenta</th>
            <th>Descripción</th>
            <th class="text-right">Debe</th>
            <th class="text-right">Haber</th>
        </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
        <tr>
            <th colspan="4" class="text-right">Totales</th>
            <th class="text-right"></th>
            <th class="text-right"></th>
        </tr>
        </tfoot>
    </table>
{% endblock %}
