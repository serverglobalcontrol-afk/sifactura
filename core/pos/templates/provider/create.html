{% extends 'form.html' %}
{% load static %}
{% load pos_extras %}
{% block assets_form %}
    <script src="{% static 'provider/js/form.js' %}"></script>
{% endblock %}

{% block form_fields %}
    <div class="row">
        {% for field in form.visible_fields %}
            {% if field.name == 'ruc' %}
                <div class="col-md-4 col-12">
                    <div class="form-group">
                        <label>{{ field.label }}:</label>
                        <div class="input-group mb-3">
                            {{ field }}
                            <div class="input-group-append">
                                <button class="btn btn-secondary btnSearchRUCInSRI" name="search_ruc_sri" disabled type="button"><i class="fas fa-search"></i> Buscar RUC con el SRI</button>
                            </div>
                        </div>
                    </div>
                </div>
            {% else %}
                <div class="{{ field|field_col_class }}">
                    <div class="form-group">
                        <label>{{ field.label }}:</label>
                        {{ field }}
                    </div>
                </div>
            {% endif %}
        {% endfor %}
    </div>
    <div class="row">
        <div class="col-12">
            <div id="sriInfo" class="alert alert-light border py-2" style="display:none;"></div>
        </div>
    </div>
{% endblock %}
