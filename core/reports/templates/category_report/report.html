{% extends 'report.html' %}
{% load static %}
{% block assets_report %}
    <script src="{% static 'category_report/js/report.js' %}" type="text/javascript"></script>
{% endblock %}

{% block content_report %}
    <div class="row">
        <div class="col-lg-5 col-md-12">
            <div class="form-group">
                <label>{{ form.date_range.label }}:</label>
                <div class="input-group mb-3">
                    {{ form.date_range }}
                    <div class="input-group-append">
                        <button class="btn btn-primary btnSearchAll" type="button">
                            <i class="fas fa-calendar-check"></i> Ver todas
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <hr>
            <table class="table table-bordered table-sm" id="tblReport" style="width:100%;">
                <thead>
                <tr>
                    <th style="width: 50%;">Categoría</th>
                    <th style="width: 25%;">Cantidad Vendida</th>
                    <th style="width: 25%;">Total Vendido</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12 text-right">
            <h1 class="font-weight-bold total">$0.00</h1>
        </div>
    </div>

    <div id="myModalDetail" class="modal fade" role="dialog">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-weight-bold">
                        <i class="fa fa-search"></i> Detalle de productos vendidos
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-12">
                                <table style="width:100%;" class="table table-bordered table-sm" id="tblDetail">
                                    <thead>
                                    <tr>
                                        <th style="width: 12%;">Fecha</th>
                                        <th style="width: 15%;">N° Factura</th>
                                        <th style="width: 25%;">Producto</th>
                                        <th style="width: 8%;">Cant.</th>
                                        <th style="width: 13%;">Precio Costo</th>
                                        <th style="width: 13%;">PVP</th>
                                        <th style="width: 14%;">Ganancia</th>
                                    </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
