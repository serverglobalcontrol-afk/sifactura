{% extends 'report.html' %}
{% load static %}
{% block assets_report %}
    <script src="{% static 'low_stock_report/js/report.js' %}" type="text/javascript"></script>
{% endblock %}

{% block content_report %}
    <div class="row">
        <div class="col-lg-12">
            <p class="text-muted"><small>* Se listan los productos inventariados cuyo stock actual llegó al mínimo
                configurado (o está en negativo).</small></p>
            <hr>
            <table class="table table-bordered table-sm" id="tblReport" style="width:100%;">
                <thead>
                <tr>
                    <th style="width: 20%;">Código</th>
                    <th style="width: 45%;">Nombre</th>
                    <th style="width: 17%;">Stock Actual</th>
                    <th style="width: 18%;">Stock Mínimo</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
{% endblock %}
