upstream server-invoicepro {
    server unix:/tmp/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name si-factura.com www.si-factura.com *.si-factura.com;
    client_max_body_size 1000M;

    access_log /home/globalcontrolec/invoicepro/logs/nginx-access.log;

    error_log /home/globalcontrolec/invoicepro/logs/nginx-error.log;

    location /media/  {
        alias /home/globalcontrolec/invoicepro/media/;
    }

   location /static/ {
        alias /home/globalcontrolec/invoicepro/staticfiles/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
   }

    location /static/admin/ {
        alias /home/globalcontrolec/invoicepro/staticfiles/admin/;
    }

    location / {
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header Host $http_host;
         proxy_set_header X-Forwarded-Port $server_port;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Proto https;
         proxy_redirect off;
         proxy_pass http://server-invoicepro;
         fastcgi_buffers 8 16k;
         fastcgi_buffer_size 32k;
         fastcgi_connect_timeout 600000s;
         fastcgi_send_timeout 600000s;
         fastcgi_read_timeout 600000s;
         proxy_read_timeout 600000s;
    }

    error_page 500 502 503 504 /templates/500.html;
}
